services:
  - type: web
    runtime: static
    name: beaded-by-char
    repo: https://github.com/benwebb100/beaded-by-char
    branch: main
    buildCommand: npm ci --omit=dev && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Keeps the onrender.com test site out of Google. Remove at cutover to the real domain.
      - key: PUBLIC_NOINDEX
        value: "true"
      # From Supabase → Project Settings → API. Safe to expose: row-level security protects the data.
      - key: PUBLIC_SUPABASE_URL
        sync: false
      - key: PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Old GHL home page URLs.
      - type: redirect
        source: /home
        destination: /
      - type: redirect
        source: /home522598
        destination: /
    headers:
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
